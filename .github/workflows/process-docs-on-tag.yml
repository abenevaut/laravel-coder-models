name: Process Docs on Tag

on:
  workflow_dispatch:
  push:
    tags:
      - laravel-docs-process-*

jobs:

  process-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Laravel Docs Process
        run: python3 laravel-docs-process/main.py

      - name: Run Benchmark
        run: python3 benchmark/main.py

      - name: Create or get release
        id: release
        run: |
          # Tente de récupérer la release existante
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} | jq -r '.id')
          
          # Si la release n'existe pas ou est null, la crée
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Content-Type: application/json" \
              -d '{"tag_name":"${{ github.ref_name }}","name":"${{ github.ref_name }}","body":"Automated release created by GitHub Actions"}' \
              https://api.github.com/repos/${{ github.repository }}/releases | jq -r '.id')
          fi
          
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Upload files to release
        run: |
          # Upload des fichiers de laravel-docs-data/
          for FILE in laravel-docs-data/*; do
            [ -f "$FILE" ] && curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$FILE" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.release.outputs.RELEASE_ID }}/assets?name=$(basename $FILE)"
          done
          
          # Upload des fichiers du benchmark
          for FILE in benchmark/results/* benchmark/reports/*; do
            [ -f "$FILE" ] && curl -s -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$FILE" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.release.outputs.RELEASE_ID }}/assets?name=$(basename $FILE)"
          done

      - name: Publish Benchmark Results and Overwatch to GitHub Pages
        run: |
          # Crée un dossier pour GitHub Pages
          mkdir -p gh-pages/benchmark
          cp -r benchmark/reports/* gh-pages/benchmark/
          
          # Ajoute le script Overwatch
          mkdir -p gh-pages/overwatch
          cp overwatch/qualify_data.html gh-pages/overwatch/
          
          # Configure Git pour pousser vers gh-pages
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global credential.helper "store --file=/tmp/.git-credentials"
          echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" > /tmp/.git-credentials
          
          # Clone la branche gh-pages (ou l'initialise)
          git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages-repo 2>/dev/null || {
            git init gh-pages-repo
            cd gh-pages-repo
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git checkout --orphan gh-pages
            git commit --allow-empty -m "Initial commit"
            git push origin gh-pages
            cd ..
          }
          
          # Configure remote pour le cas où le clone a réussi
          cd gh-pages-repo
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          cd ..
          
          # Copie les résultats et le script Overwatch dans gh-pages-repo
          cp -r gh-pages/* gh-pages-repo/
          
          # Push vers gh-pages
          cd gh-pages-repo
          git add .
          git commit -m "Update benchmark results and Overwatch script for ${{ github.ref_name }}"
          git push --force-with-lease origin gh-pages
